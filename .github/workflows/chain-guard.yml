# Restarts the snapshot chain if it has stopped.
#
# The chain (snapshot.yml) queues its own successor, but a run that never
# starts cannot: on 2026-10-05 19:19 GitHub failed to assign a runner, the run
# was cancelled before any step, and capture stopped for hours. This guard
# runs every 10 minutes (GitHub's cron is late and sometimes skips, so `daily`
# restarts the chain too). It only starts a run when none is queued or running,
# so it can never create duplicates; pacing in snapshot.yml keeps >= 285 s
# between fetches regardless.
#
# Not used: an `on: workflow_run` trigger. Snapshot runs are started by
# GITHUB_TOKEN, and events caused by GITHUB_TOKEN do not start workflows (only
# workflow_dispatch/repository_dispatch are exempt; GitHub docs), and on
# 2026-10-05 it indeed did not fire after chain runs.
name: chain-guard

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: chain-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: sitr
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restart the chain if idle
        run: python -m sitr chain-restart
