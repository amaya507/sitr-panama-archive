# Weekly: consolidated exports + gap report + completed-month raw bundles
# -> Google Drive SITR/ folder, via rclone. Entirely separate from capture:
# if this fails, nothing else is affected; an issue is opened.
name: mirror

on:
  schedule:
    - cron: "43 7 * * 1"   # Mondays 07:43 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONIOENCODING: utf-8
      # rclone remote "sitr:" rooted at the SITR/ folder. See README "Google Drive".
      RCLONE_CONFIG_SITR_TYPE: drive
      RCLONE_CONFIG_SITR_SCOPE: ${{ vars.GDRIVE_SCOPE || 'drive' }}
      RCLONE_CONFIG_SITR_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_SITR_FOLDER_ID }}
      RCLONE_CONFIG_SITR_TEAM_DRIVE: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
      RCLONE_CONFIG_SITR_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      RCLONE_CONFIG_SITR_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_SITR_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_SITR_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install rclone
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone && rclone version | head -1

      - name: Check Drive credentials are configured
        run: |
          if [ -z "$RCLONE_CONFIG_SITR_SERVICE_ACCOUNT_CREDENTIALS" ] && [ -z "$RCLONE_CONFIG_SITR_TOKEN" ]; then
            python -m sitr alert --key drive-mirror --title "Drive mirror not configured" \
              --body "No Drive credentials in repository secrets. See README 'Google Drive'. Capture is unaffected."
            exit 1
          fi
          rclone lsf sitr: --max-depth 1 >/dev/null

      - name: Mirror
        run: python -m sitr mirror --remote sitr:

      - name: Commit archive manifest
        if: always()
        run: |
          git config user.name "sitr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest/drive_raw_archive.csv 2>/dev/null || true
          git commit -q -m "manifest: drive mirror $(date -u +%F)" || echo "nothing to commit"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done

      - name: Alert
        if: failure()
        run: python -m sitr alert --key drive-mirror --title "Weekly Google Drive mirror failed" --body "Capture is unaffected. See the run log."
