# Maintenance without anyone logged in: edit ops/requests.json and push.
# Runs with the repository's own token (issues only).
name: ops

on:
  push:
    branches: [main]
    paths: ["ops/requests.json"]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  ops:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Close requested issues (idempotent)
        run: |
          jq -c '.close_issues[]' ops/requests.json | while read -r req; do
            n=$(echo "$req" | jq -r .number); c=$(echo "$req" | jq -r .comment)
            state=$(gh issue view "$n" --json state -q .state)
            if [ "$state" = "OPEN" ]; then
              gh issue close "$n" --comment "$c" && echo "closed #$n"
            else
              echo "#$n already $state"
            fi
          done
