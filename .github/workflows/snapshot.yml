# Every ~5 minutes: fetch the six live endpoints once each (sequentially) and
# store the raw responses as one chunk in that day's GitHub release.
#
# Cadence: GitHub's cron scheduler is far too unreliable for a 5-minute
# interval (on 2026-09-29 it fired 2 of ~120 expected runs). So each run
# queues the next one as its FIRST step (a workflow_dispatch from GITHUB_TOKEN
# is allowed to start a new run; GitHub holds it until the current run ends).
# The cron below only RESTARTS the chain if it ever breaks.
#
# Spacing is enforced by `python -m sitr pace`, which waits until >= 285 s
# after the previous chunk, so duplicate triggers can never poll CND faster.
# The optional environment "pacer" (Settings -> Environments, wait timer 4 min)
# makes GitHub hold the queued run without occupying a runner; without it the
# pace step does the waiting on the runner. Either way the cadence is ~5 min.
#
# To STOP all capture: Actions -> snapshot -> "..." -> Disable workflow.
name: snapshot

on:
  schedule:
    - cron: "7,37 * * * *"   # chain restarter only
  workflow_dispatch:

permissions:
  contents: write   # create releases / upload assets
  issues: write     # alerts
  actions: write    # dispatch the next run in the chain

concurrency:
  group: snapshot
  cancel-in-progress: false   # at most one running + one pending; extra triggers collapse

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: pacer
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            sitr
            scripts
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Queue the next run in the chain (first, so even a killed run can't break it)
        # GitHub holds the queued run until this one ends, however it ends
        # (success, failure, timeout, cancellation). Pacing below keeps >= 285 s spacing.
        timeout-minutes: 2
        continue-on-error: true
        run: python -m sitr chain-next

      - name: Pace (never less than 285 s after the previous run or fetch)
        # Fallback: if the pace command itself fails for any reason, wait the full
        # interval anyway, so a failing run can never make the chain spin fast.
        timeout-minutes: 7
        run: python -m sitr pace --min-interval 285 || sleep 285

      - name: Fetch endpoints
        timeout-minutes: 6
        run: python -m sitr snapshot --out chunks

      - name: Upload chunk to daily release
        timeout-minutes: 4
        run: bash scripts/upload_chunks.sh chunks

      - name: Keep chunk as artifact if upload failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chunk-${{ github.run_id }}
          path: chunks/
          retention-days: 30

      - name: Alert
        if: failure()
        run: >
          python -m sitr alert --key snapshot-workflow
          --title "Snapshot workflow failed"
          --body "A snapshot run failed inside the pipeline (not a source outage, which is alerted separately).
          If the upload step failed, the chunk is kept as a workflow artifact for 30 days (README 'Recovering a chunk')."
