name: tests
on:
  push:
    paths: ["sitr/**", "tests/**", "requirements.txt", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          TZ: Asia/Kolkata   # prove the runner timezone never leaks into the data
